<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DCL Transparency Board</title>
<style>
  :root {
    --bg: #0e1117; --panel: #161b22; --border: #262c36;
    --text: #e6edf3; --muted: #8b949e;
    --accent: #00ffa3; --warn: #ffc107; --danger: #ff4d5e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; padding: 32px 24px 64px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  h2 { font-size: 14px; margin: 0 0 14px; color: var(--muted); font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.04em; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 28px; }
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px; margin-bottom: 28px; }
  .kpi { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
  .kpi .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  .kpi .value { font-size: 26px; font-weight: 600; color: var(--accent); margin-top: 6px; }
  .services-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px; margin-bottom: 28px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px;
    min-width: 0; max-width: 100%; }
  .service-stat { font-size: 13px; color: var(--muted); margin: 3px 0; }
  .service-stat b { color: var(--text); }
  .placeholder { color: var(--muted); font-size: 13px; line-height: 1.5; }
  .feed-meta { color: var(--muted); font-size: 13px; margin: -4px 0 12px; line-height: 1.5; }
  .table-scroll { width: 100%; max-width: 100%; overflow-x: auto; }
  table { width: max-content; min-width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  .verdict-COMMIT { color: var(--accent); }
  .verdict-NO_COMMIT { color: var(--danger); }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px;
    background: #21262d; color: var(--muted); }
  .canonical-panel { margin-top: 28px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  details .service-stat { margin-top: 6px; word-break: break-all; }
  td.payment-tx { word-break: break-all; max-width: 220px; }
  details.fold { border: 1px solid var(--border); border-radius: 8px; margin: 8px 0; background: #12171e; }
  details.fold:not([open]) > .fold-body { display: none; }
  details.fold > summary { cursor: pointer; padding: 10px 12px; color: var(--text); font-size: 13px; }
  details.fold > summary::before { content: "▸  "; color: var(--accent); }
  details.fold[open] > summary::before { content: "▾  "; }
  details.day-fold { margin-left: 10px; }
  details.fold > .fold-body { padding: 0 8px 10px; }
  .load-older { margin-top: 14px; background: transparent; color: var(--accent);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 13px; }
  .load-older:disabled { color: var(--muted); cursor: progress; }
  footer { margin-top: 32px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>

<h1>🛡️ DCL Transparency Board</h1>
<div class="sub" id="generated-at">Loading…</div>

<div class="kpi-row">
  <div class="kpi"><div class="label">Total Audits</div><div class="value" id="kpi-audits">–</div></div>
  <div class="kpi"><div class="label">USDC Protected</div><div class="value" id="kpi-usdc">–</div></div>
</div>

<div class="services-row" id="services"></div>

<div class="panel">
  <h2>Live Audit Stream (all services)</h2>
  <div id="feed"><div class="placeholder">Loading audit history…</div></div>
</div>

<div class="panel canonical-panel">
  <h2>Canonical Audit Events</h2>
  <div id="canonical-feed"></div>
</div>

<footer>DCL Trust Oracle — data refreshes on each export cycle. Not real-time.</footer>

<script>
const FLAT_LIMIT = 20;
const DAY_CHUNK = 40;

async function loadMetrics() {
  const res = await fetch('./metrics.json', { cache: 'no-store' });
  if (!res.ok) throw new Error('metrics.json not found');
  return res.json();
}

async function loadHistory() {
  const res = await fetch('./audit_history.json', { cache: 'no-store' });
  if (res.status === 404) return [];
  if (!res.ok) throw new Error('audit history could not be loaded');
  const body = await res.json();
  if (Array.isArray(body)) return body;
  if (body && Array.isArray(body.events)) return body.events;
  return [];
}

function fmtUsdc(n) {
  return '$' + Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function renderServiceCard(name, label, data) {
  if (!data || !data.available) {
    return `
      <div class="panel">
        <h2>${label}</h2>
        <div class="placeholder">${(data && data.note) || 'No data yet.'}</div>
      </div>`;
  }
  if (name === 'sentinel') {
    return `
      <div class="panel">
        <h2>${label}</h2>
        <div class="service-stat">Events: <b>${data.total_events}</b></div>
        <div class="service-stat">COMMIT / NO_COMMIT: <b>${data.commit_count}</b> / <b>${data.no_commit_count}</b></div>
        <div class="service-stat">USDC collected: <b>${fmtUsdc(data.usdc_collected)}</b></div>
      </div>`;
  }
  return `
    <div class="panel">
      <h2>${label}</h2>
      <div class="service-stat">Audits: <b>${data.total_audits}</b></div>
      <div class="service-stat">COMMIT / NO_COMMIT: <b>${data.commit_count}</b> / <b>${data.no_commit_count}</b></div>
      <div class="service-stat">Unique agents: <b>${data.unique_agents}</b></div>
      <div class="service-stat">USDC protected: <b>${fmtUsdc(data.usdc_protected)}</b></div>
    </div>`;
}

function esc(value) {
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function cell(value) {
  if (value === undefined || value === null || value === '') return '—';
  return esc(value);
}

function eventKey(event) {
  return [
    event.service, event.timestamp, event.agent_id, event.task_type,
    event.scan_type, event.verdict, event.route, event.amount_usdc
  ].join('\u0001');
}

function eventTime(value) {
  const parsed = Date.parse(String(value || '').replace(' ', 'T'));
  return Number.isNaN(parsed) ? 0 : parsed;
}

function collectEvents(data, history) {
  const groups = [];
  if (data && Array.isArray(data.recent_events)) groups.push(data.recent_events);
  const services = data && data.services;
  if (services && typeof services === 'object') {
    Object.keys(services).forEach(name => {
      const service = services[name];
      if (service && Array.isArray(service.recent_events)) groups.push(service.recent_events);
    });
  }
  if (Array.isArray(history)) groups.push(history);
  const seen = new Set();
  const events = [];
  groups.forEach(group => {
    group.forEach(event => {
      if (!event || typeof event !== 'object') return;
      const key = eventKey(event);
      if (seen.has(key)) return;
      seen.add(key);
      events.push(event);
    });
  });
  events.sort((a, b) => eventTime(b.timestamp) - eventTime(a.timestamp));
  return events;
}

function verdictCell(verdict) {
  const text = verdict === undefined || verdict === null || verdict === '' ? '—' : String(verdict);
  const known = text === 'COMMIT' || text === 'NO_COMMIT';
  return `<td${known ? ' class="verdict-' + text + '"' : ''}>${esc(text)}</td>`;
}

function feedRow(event) {
  const amount = event.amount_usdc != null && event.amount_usdc !== ''
    ? esc(fmtUsdc(event.amount_usdc))
    : '—';
  const kind = event.task_type ?? event.scan_type;
  return `<tr data-timestamp="${cell(event.timestamp)}">
      <td>${cell(event.timestamp)}</td>
      <td><span class="badge">${cell(event.service)}</span></td>
      <td>${cell(event.agent_id)}</td>
      ${verdictCell(event.verdict)}
      <td>${cell(kind)}</td>
      <td>${cell(event.route)}</td>
      <td>${amount}</td>
      <td><details>
        <summary>payment</summary>
        <div class="service-stat">route: <b>${cell(event.route)}</b></div>
        <div class="service-stat">amount: <b>${amount}</b></div>
        <div class="service-stat">agent: <b>${cell(event.agent_id)}</b></div>
        <div class="service-stat">type: <b>${cell(kind)}</b></div>
      </details></td>
    </tr>`;
}

function eventNoun(count) {
  return count === 1 ? 'event' : 'events';
}

function eventDay(event) {
  const day = String(event.timestamp || '').slice(0, 10);
  return /^\d{4}-\d{2}-\d{2}$/.test(day) ? day : 'Unknown date';
}

function groupConsecutive(events, keyFn) {
  const groups = [];
  events.forEach(event => {
    const key = keyFn(event);
    const last = groups[groups.length - 1];
    if (!last || last.key !== key) groups.push({ key, events: [event] });
    else last.events.push(event);
  });
  return groups;
}

function feedTable(events) {
  return `<div class="table-scroll">
      <table>
        <thead><tr>
          <th>Time (UTC)</th><th>Service</th><th>Agent</th><th>Verdict</th>
          <th>Type</th><th>Route</th><th>Amount</th><th></th>
        </tr></thead>
        <tbody>${events.map(feedRow).join('')}</tbody>
      </table>
    </div>`;
}

function dayFolds(events, openFirstDay) {
  return groupConsecutive(events, eventDay).map((group, dayIndex) => {
    const parts = [];
    for (let start = 0; start < group.events.length; start += DAY_CHUNK) {
      parts.push(group.events.slice(start, start + DAY_CHUNK));
    }
    return parts.map((part, partIndex) => {
      const range = parts.length === 1
        ? ''
        : ' · ' + (partIndex * DAY_CHUNK + 1) + '–' + (partIndex * DAY_CHUNK + part.length);
      const label = group.key + ' · ' + group.events.length + ' ' + eventNoun(group.events.length) + range;
      const open = openFirstDay && dayIndex === 0 && partIndex === 0 ? ' open' : '';
      return `<details class="fold day-fold"${open}>
        <summary>${esc(label)}</summary>
        <div class="fold-body">${feedTable(part)}</div>
      </details>`;
    }).join('');
  }).join('');
}

function historyFolds(events) {
  return groupConsecutive(events, event => eventDay(event).slice(0, 7)).map((group, monthIndex) => {
    const newest = group.events[0].timestamp;
    const oldest = group.events[group.events.length - 1].timestamp;
    const label = group.key + ' · ' + group.events.length + ' ' + eventNoun(group.events.length)
      + ' · ' + newest + ' → ' + oldest;
    const open = monthIndex === 0;
    return `<details class="fold month-fold"${open ? ' open' : ''}>
      <summary>${esc(label)}</summary>
      <div class="fold-body">${dayFolds(group.events, open)}</div>
    </details>`;
  }).join('');
}

function renderFeed(events, historyError) {
  const el = document.getElementById('feed');
  if (!events || events.length === 0) {
    el.innerHTML = '<div class="placeholder">No events yet.</div>';
    return;
  }
  const oldest = events[events.length - 1];
  const note = historyError
    ? '<div class="placeholder">Older saved events could not be loaded. Showing the latest export only.</div>'
    : '';
  const folded = events.length > FLAT_LIMIT;
  const meta = events.length + ' ' + eventNoun(events.length)
    + ', newest first. Earliest: ' + oldest.timestamp + '.'
    + (folded ? ' Earlier days and months are collapsed.' : '');
  const body = folded
    ? historyFolds(events)
    : feedTable(events);
  const collapse = folded
    ? '<button class="load-older" id="collapse-history" type="button">Collapse history</button>'
    : '';
  el.innerHTML = `
    <div class="feed-meta" id="feed-meta">${esc(meta)}</div>
    ${note}
    ${body}
    ${collapse}`;
}

function renderCanonical(feed) {
  const el = document.getElementById('canonical-feed');
  if (!el) return;
  try {
    if (!feed || typeof feed !== 'object' || feed.available === false) {
      const note = feed && feed.reason
        ? feed.reason
        : 'Canonical audit events are not available.';
      el.innerHTML = '<div class="placeholder">' + esc(note) + '</div>';
      return;
    }
    const events = Array.isArray(feed.events)
      ? feed.events.filter(event => event && typeof event === 'object')
      : [];
    if (events.length === 0) {
      el.innerHTML = '<div class="placeholder">No canonical audit events yet.</div>';
      return;
    }
    const rows = events.map(event => {
      const verdict = typeof event.verdict === 'string' ? event.verdict : '';
      const ids = event.event_id || event.trace_id || (event.proof && typeof event.proof === 'object')
        ? `<details>
            <summary>ids</summary>
            <div class="service-stat">event_id: <b>${cell(event.event_id)}</b></div>
            <div class="service-stat">trace_id: <b>${cell(event.trace_id)}</b></div>
            ${event.proof && event.proof.tx_hash ? `<div class="service-stat">proof tx: <b>${cell(event.proof.tx_hash)}</b></div>` : ''}
            ${event.proof && event.proof.chain_index != null && event.proof.chain_index !== '' ? `<div class="service-stat">chain index: <b>${cell(event.proof.chain_index)}</b></div>` : ''}
          </details>`
        : '—';
      const payment = event.payment && typeof event.payment === 'object' ? event.payment : null;
      const amount = payment && payment.amount_usdc !== undefined && payment.amount_usdc !== null && payment.amount_usdc !== ''
        ? esc(fmtUsdc(payment.amount_usdc))
        : '—';
      const paymentTx = payment ? cell(payment.tx_hash) : '—';
      return `<tr data-timestamp="${cell(event.timestamp)}">
        <td>${cell(event.timestamp)}</td>
        <td><span class="badge">${cell(event.producer)}</span></td>
        <td>${cell(event.route)}</td>
        <td>${cell(event.agent_id)}</td>
        ${verdictCell(verdict)}
        <td>${cell(event.policy_id)}</td>
        <td>${cell(event.policy_version)}</td>
        <td>${amount}</td>
        <td class="payment-tx">${paymentTx}</td>
        <td>${ids}</td>
      </tr>`;
    }).join('');
    el.innerHTML = `
      <div class="feed-meta">${events.length} canonical events. Open ids on any row for event, trace, and proof.</div>
      <div class="table-scroll">
      <table>
        <thead><tr>
          <th>Time (UTC)</th><th>Producer</th><th>Route</th><th>Agent</th>
          <th>Verdict</th><th>Policy</th><th>Version</th><th>Amount</th><th>Payment tx</th><th>Ids</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      </div>`;
  } catch (err) {
    el.innerHTML = '<div class="placeholder">Canonical audit events could not be displayed.</div>';
    console.error(err);
  }
}

document.getElementById('feed').addEventListener('click', event => {
  const button = event.target.closest('#collapse-history');
  if (!button) return;
  document.querySelectorAll('#feed details.fold').forEach(node => { node.open = false; });
  const month = document.querySelector('#feed details.month-fold');
  const day = document.querySelector('#feed details.day-fold');
  if (month) month.open = true;
  if (day) day.open = true;
});

Promise.all([
  loadMetrics(),
  loadHistory().then(events => ({ events, error: false })).catch(() => ({ events: [], error: true }))
]).then(([data, history]) => {
  document.getElementById('generated-at').textContent =
    'Last updated: ' + new Date(data.generated_at).toUTCString();
  document.getElementById('kpi-audits').textContent = data.total_audits;
  document.getElementById('kpi-usdc').textContent = fmtUsdc(data.total_usdc_protected);

  document.getElementById('services').innerHTML =
    renderServiceCard('webhook', 'Trust Oracle (webhook)', data.services.webhook) +
    renderServiceCard('bazaar', 'Bazaar (x402 v2)', data.services.bazaar) +
    renderServiceCard('sentinel', 'Update Sentinel', data.services.sentinel) +
    renderServiceCard('identity_guard', 'Identity Guard (TRON)', data.services.identity_guard);

  renderFeed(collectEvents(data, history.events), history.error);
  renderCanonical(data.canonical_audit_events);
}).catch(err => {
  document.getElementById('generated-at').textContent = 'metrics.json not found yet — waiting for first export.';
  document.getElementById('feed').innerHTML = '<div class="placeholder">Audit events could not be loaded.</div>';
  console.error(err);
});
</script>

</body>
</html>
